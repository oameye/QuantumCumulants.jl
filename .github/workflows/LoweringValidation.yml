name: Recursive Lowering Validation

on:
  push:
    branches:
      - 'experiment/moment-ir-fast-lowering'
    paths:
      - '.github/workflows/LoweringValidation.yml'
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
  workflow_dispatch:

concurrency:
  group: recursive-lowering-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  jet:
    name: JET
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run JET analysis
        run: julia --project=test test/quality/JET.jl

  format:
    name: Runic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
