name: Materialize closure canonical plan

on:
  push:
    branches:
      - ci/materialize-closure-canonical-plan

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply source patch
        run: python benchmark/materialize_closure_plan.py
      - name: Check patch
        run: git diff --check
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/canonical.jl src/graph.jl
          git commit -m "perf: reuse closure canonicalization fingerprint [skip ci]"
          git push
